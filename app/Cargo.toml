[package]
name = "heddobureika"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yew = { workspace = true, features = ["csr"], optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
gloo = { workspace = true, features = ["futures"] }
js-sys.workspace = true
glyphon.workspace = true
taffy.workspace = true
wgpu = { workspace = true, features = ["std", "webgpu", "webgl", "wgsl"] }
bytemuck = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
base64.workspace = true
rkyv.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
sha2.workspace = true
web-sys = { workspace = true, features = ["BinaryType", "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "CloseEvent", "Document", "DomRect", "Element", "ErrorEvent", "Event", "File", "FileList", "HtmlCanvasElement", "HtmlImageElement", "HtmlInputElement", "HtmlSelectElement", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent", "ImageData", "InputEvent", "KeyboardEvent", "MessageEvent", "Path2d", "PointerEvent", "Response", "Storage", "Touch", "TouchEvent", "TouchList", "Url", "UrlSearchParams", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebSocket", "WheelEvent", "Window"] }
heddobureika-core.workspace = true
image-pipeline.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Force getrandom 0.2 "js" feature for transitive wasm32-unknown-unknown deps.
getrandom_02 = { workspace = true, features = ["js"] }

[dev-dependencies]
wasm-bindgen-test.workspace = true
console_error_panic_hook.workspace = true
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }

[features]
default = ["dev-panel-yew"]
dev-panel-yew = ["yew"]
