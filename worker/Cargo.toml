[package]
name = "heddobureika-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
heddobureika-core.workspace = true
heddobureika-session.workspace = true
heddobureika-game.workspace = true
js-sys.workspace = true
rkyv.workspace = true
worker.workspace = true
base64.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
imagesize.workspace = true
image-pipeline.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Enable Web Crypto entropy for p256's transitive getrandom dependency.
getrandom = { workspace = true, features = ["wasm_js"] }
